<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><style>
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18)}}
.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-4deg)}}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.al{animation:al 2s ease-in-out infinite}.ar{animation:ar 2s ease-in-out infinite}
@keyframes al{0%,45%{opacity:1;transform:translateX(0)}20%{transform:translateX(-14px)}50%,100%{opacity:.15}}
@keyframes ar{0%,45%{opacity:.15}50%,95%{opacity:1}70%{transform:translateX(14px)}}
.walker{animation:walk 5s linear infinite}
@keyframes walk{0%{transform:translateX(-170px)}80%,100%{transform:translateX(200px)}}
.step{animation:step .5s ease-in-out infinite alternate}
@keyframes step{to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="600" fill="#DFF1FF"/><circle cx="680" cy="90" r="46" fill="#FFE28A"/><ellipse cx="150" cy="110" rx="70" ry="26" fill="#fff"/><ellipse cx="200" cy="96" rx="46" ry="26" fill="#fff"/><rect x="0" y="340" width="800" height="40" fill="#C9D3C1"/><rect x="0" y="374" width="800" height="10" fill="#9AA3A9"/><rect x="0" y="380" width="800" height="220" fill="#4A5058"/><rect x="230" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="280" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="330" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="380" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="430" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="480" y="394" width="30" height="192" fill="#F4F4F0"/><rect x="530" y="394" width="30" height="192" fill="#F4F4F0"/><g transform="translate(640,240) scale(0.9)"><rect x="-8" y="60" width="16" height="200" fill="#5B6168"/><rect x="-34" y="-80" width="68" height="150" rx="18" fill="#2B2F36"/><circle cx="0" cy="-42" r="22" fill="#E5484D"/><circle cx="0" cy="22" r="22" fill="#1F3A2B"/><circle cx="0" cy="-42" r="32" fill="#E5484D" opacity=".25"/></g><circle class="pulse" cx="640" cy="202" r="30" fill="#E5484D" opacity=".35"/><path d="M300 352 L520 352" stroke="#E5484D" stroke-width="6" stroke-dasharray="14 10"/><g transform="translate(410,206) scale(1.05)"><rect x="-24" y="56" width="18" height="62" rx="9" fill="#2F5DA8"/><rect x="6" y="56" width="18" height="62" rx="9" fill="#2F5DA8"/><ellipse cx="-17" cy="120" rx="15" ry="8" fill="#2B2F36"/><ellipse cx="17" cy="120" rx="15" ry="8" fill="#2B2F36"/><rect x="-40" y="-14" width="80" height="66" rx="16" fill="#E5484D"/><rect x="-30" y="-20" width="60" height="84" rx="22" fill="#4F9DFF"/><path d="M28 -4 L36 40" stroke="#4F9DFF" stroke-width="16" stroke-linecap="round"/><circle cx="37" cy="46" r="10" fill="#FFD9B8"/><path d="M-28 -4 L-38 40" stroke="#4F9DFF" stroke-width="16" stroke-linecap="round"/><circle cx="-39" cy="46" r="10" fill="#FFD9B8"/><circle cx="0" cy="-58" r="38" fill="#FFD9B8"/><path d="M-40 -66 A40 40 0 0 1 40 -66 Z" fill="#FFC93C"/><path d="M-46 -64 Q0 -56 46 -64" stroke="#FFC93C" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-13" cy="-52" r="4.5" fill="#2B2F36"/><circle cx="13" cy="-52" r="4.5" fill="#2B2F36"/><path d="M-10 -38 Q0 -30 10 -38" stroke="#2B2F36" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-24" cy="-40" r="6" fill="#FF9E9E" opacity=".6"/><circle cx="24" cy="-40" r="6" fill="#FF9E9E" opacity=".6"/></g><g class="pop"><g transform="translate(560,160)"><rect x="-58" y="-36" width="116" height="72" rx="20" fill="#fff" stroke="#E5484D" stroke-width="5"/><text y="14" text-anchor="middle" font-size="38" font-weight="900" fill="#E5484D" font-family="Malgun Gothic, sans-serif">멈춰!</text></g></g></svg>