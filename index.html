<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6대 의무교육 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1F2328;
    --muted: #5B6168;
    --line: #E3DFD6;
    --accent: #1F6F5C;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.55;
    word-break: keep-all;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid #F2B705; outline-offset: 3px; }

  /* 상단 바 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 28px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 1.25rem; font-weight: 700; }
  .brand small { display: block; font-size: .8rem; font-weight: 400; color: var(--muted); }
  .home-btn {
    min-height: 56px; padding: 0 26px;
    border: 2px solid var(--accent); border-radius: 14px;
    background: var(--card); color: var(--accent);
    font-size: 1.05rem; font-weight: 700;
  }
  .home-btn:hover { background: var(--accent); color: #fff; }

  main { max-width: 1120px; margin: 0 auto; padding: 32px 28px 64px; }

  /* 경로 표시 */
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; color: var(--muted); font-size: .95rem; }
  .crumbs button { border: 0; background: none; padding: 4px 2px; color: var(--accent); text-decoration: underline; font-weight: 700; }

  h1 { font-size: 2rem; margin: 0 0 6px; line-height: 1.3; }
  .lead { font-size: 1.1rem; color: var(--muted); margin: 0 0 28px; }

  /* 진행률 */
  .progress-box {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 26px; margin-bottom: 28px;
  }
  .progress-num { font-size: 2.2rem; font-weight: 800; white-space: nowrap; }
  .progress-num span { font-size: 1.1rem; color: var(--muted); font-weight: 400; }
  .bar { flex: 1; min-width: 220px; height: 22px; background: #ECE8DF; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; }

  /* 카드 그리드 */
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    text-align: left; width: 100%;
    background: var(--card);
    border: 2px solid var(--line); border-radius: var(--radius);
    padding: 24px 24px 22px;
    border-top: 12px solid var(--c, var(--accent));
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.08); border-color: var(--c, var(--accent)); }
  .card .icon { font-size: 2.6rem; line-height: 1; }
  .card .title { font-size: 1.4rem; font-weight: 800; }
  .card .meta { color: var(--muted); font-size: 1rem; }
  .card .mini-bar { width: 100%; height: 12px; background: #ECE8DF; border-radius: 99px; overflow: hidden; }
  .card .mini-bar > div { height: 100%; background: var(--c); }
  .notice { font-size: .95rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: #FFF3D6; color: #7A5300; }
  .notice.ok { background: #E3F4EA; color: #1C6B3F; }

  /* 대상 고르기 */
  .levels { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .level { align-items: center; text-align: center; padding: 36px 24px; }
  .level .icon { font-size: 3.4rem; }
  .level .title { font-size: 1.7rem; }

  /* 주제 카드 */
  .topic .no {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--c); color: #fff; font-weight: 800; font-size: 1.2rem;
  }
  .topic .title { font-size: 1.25rem; }
  .badge { position: absolute; top: 18px; right: 18px; font-size: .9rem; font-weight: 800; padding: 5px 12px; border-radius: 99px; }
  .badge.rec { background: #FFE08A; color: #5C4200; }
  .badge.done { background: #E3F4EA; color: #1C6B3F; }

  /* 준비 중 화면 */
  .placeholder {
    background: var(--card); border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 40px; text-align: center; color: var(--muted); font-size: 1.15rem;
  }
  .placeholder strong { display: block; font-size: 1.5rem; color: var(--ink); margin-bottom: 8px; }


  /* ---------- 수업 화면 ---------- */
  .lesson-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 8px; }
  .play-btn {
    min-height: 64px; padding: 0 30px; border: 0; border-radius: 16px;
    background: var(--c); color: #fff; font-size: 1.25rem; font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }
  .play-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .goal { background: var(--card); border-left: 8px solid var(--c); border-radius: 12px; padding: 14px 20px; margin: 18px 0 24px; font-size: 1.1rem; }
  .status-pill { display: inline-block; font-size: .85rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #FFF3D6; color: #7A5300; margin-left: 8px; vertical-align: middle; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 3px solid var(--line); margin-bottom: 24px; }
  .tab {
    min-height: 56px; padding: 0 22px; border: 0; background: none;
    font-size: 1.1rem; font-weight: 700; color: var(--muted);
    border-bottom: 5px solid transparent; margin-bottom: -3px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c); }
  .thumbs { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .thumb { border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 8px; text-align: left; }
  .thumb:hover { border-color: var(--c); }
  .thumb .mini { aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; position: relative; }
  .thumb .mini .slide { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .thumb .mini * { pointer-events: none; }
  .thumb .cap { display: block; padding: 8px 4px 2px; font-weight: 700; }
  .flow-bar { display: flex; height: 54px; border-radius: 14px; overflow: hidden; margin-bottom: 22px; }
  .flow-bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: .95rem; border-right: 3px solid var(--bg); }
  .flow-list { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 12px; }
  .flow-list li { display: grid; grid-template-columns: 90px 1fr; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  .flow-list .min { font-size: 1.6rem; font-weight: 800; color: var(--c); line-height: 1.1; }
  .flow-list .min small { display: block; font-size: .85rem; color: var(--muted); font-weight: 400; }
  .flow-list b { font-size: 1.1rem; }
  .two-col { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; }
  .box h3 { margin: 0 0 10px; font-size: 1.15rem; }
  .box ul { margin: 0; padding-left: 1.2em; }
  .box.warn { background: #FFF7E0; border-color: #F2D48A; }
  .box.quiz-key { margin-top: 20px; }
  .box.quiz-key ol { margin: 0; padding-left: 1.4em; display: grid; gap: 14px; }
  .box.quiz-key .meta { font-size: 1rem; line-height: 1.6; }
  .ans { display: inline-block; min-width: 1.8em; text-align: center; border-radius: 999px; font-weight: 700; color: #fff; padding: 0 .4em; margin-left: 4px; }
  .ans-O { background: #2DB86E; } .ans-X { background: #E5484D; }
  .sheet-preview { display: grid; gap: 20px; grid-template-columns: minmax(220px, 340px) 1fr; align-items: start; }
  .sheet-preview img { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .big-link { display: inline-flex; align-items: center; min-height: 56px; padding: 0 24px; border-radius: 14px; background: var(--c); color: #fff; font-weight: 800; text-decoration: none; margin: 6px 8px 6px 0; }
  .big-link.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .links { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .links a { display: block; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px 20px; color: var(--ink); text-decoration: none; }
  .links a:hover { border-color: var(--c); }
  .links .org { font-size: .9rem; color: var(--muted); }
  .links .t { display: block; font-size: 1.15rem; font-weight: 700; color: var(--accent); }

  /* ---------- 슬라이드 (발표 모드와 미리보기 공용, 1600×900 기준) ---------- */
  .slide {
    --stripe: #2B2F36;
    width: 1600px; height: 900px; position: relative; overflow: hidden;
    background: #FFFDF7; color: #22262B;
    font-family: "Jua", "Malgun Gothic", sans-serif;
  }
  .slide::after { /* 아래쪽 건널목 띠: 모든 슬라이드의 공통 표시 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px;
    background: repeating-linear-gradient(90deg, #F4F4F0 0 70px, var(--stripe) 70px 120px);
  }
  .slide .img { position: absolute; left: 70px; top: 70px; width: 820px; height: 615px; border-radius: 36px; overflow: hidden; box-shadow: 0 14px 0 rgba(0,0,0,.08); }
  .slide .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide .txt { position: absolute; left: 950px; right: 70px; top: 90px; bottom: 120px; display: flex; flex-direction: column; justify-content: center; }
  .slide h2 { font-size: 104px; line-height: 1.1; margin: 0 0 24px; font-weight: 400; }
  .slide p { font-size: 58px; line-height: 1.35; margin: 0; white-space: pre-line; }
  .slide .kicker { font-size: 44px; color: var(--c); margin-bottom: 12px; }
  .slide.promise .num {
    width: 130px; height: 130px; border-radius: 50%; background: var(--c); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 84px; margin-bottom: 18px;
  }
  .slide.promise h2 { font-size: 190px; color: var(--c); margin-bottom: 18px; }
  .slide.quiz { background: #F2F8FF; }
  .slide.quiz .qbox { position: absolute; left: 120px; right: 120px; top: 110px; text-align: center; }
  .slide.quiz .qno { font-size: 48px; color: var(--c); }
  .slide.quiz .q { font-size: 84px; line-height: 1.3; margin-top: 18px; }
  .slide.quiz .ox { position: absolute; left: 0; right: 0; top: 440px; display: flex; justify-content: center; gap: 160px; }
  .slide.quiz .ox span { width: 260px; height: 260px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 200px; line-height: 1; border: 14px solid #D7DEE6; color: #C4CCD5; background: #fff; }
  .slide.quiz.reveal .ox span.on { border-color: var(--okc); color: var(--okc); transform: scale(1.08); }
  .slide.quiz.reveal .ox span.off { opacity: .35; }
  .slide.quiz .why { position: absolute; left: 60px; right: 60px; top: 728px; text-align: center; font-size: 50px; visibility: hidden; }
  .slide.quiz.reveal .why { visibility: visible; }
  /* 정답 장면: O X를 줄여 올리고, 그 아래 이유(크게) + 해설(작게) */
  .slide.quiz.reveal.has-ex .ox { top: 395px; transform: scale(.66); transform-origin: top center; }
  .slide.quiz.reveal.has-ex .why { top: 600px; font-size: 52px; color: var(--okc); }
  .slide.quiz .ex { display: none; }
  .slide.quiz.reveal .ex { display: block; position: absolute; left: 110px; right: 110px; top: 690px; padding: 22px 34px; border-radius: 26px; background: #fff; font-size: 38px; line-height: 1.45; text-align: center; color: #3B4450; }
  .slide.wrap { background: var(--c); color: #fff; }
  .slide.wrap .words { position: absolute; left: 0; right: 0; top: 170px; display: flex; justify-content: center; gap: 70px; }
  .slide.wrap .words div { width: 400px; height: 400px; border-radius: 50%; background: #fff; color: var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 140px; line-height: 1.05; }
  .slide.wrap .words small { font-size: 110px; }
  .slide.wrap .sub { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-size: 72px; }


  /* 영상 슬라이드 */
  .slide.video { background: #22262B; color: #fff; }
  .slide.video .vbox { position: absolute; left: 230px; top: 60px; width: 1140px; height: 641px; border-radius: 28px; overflow: hidden; background: #000; }
  .slide.video .vbox img, .slide.video .vbox iframe { width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
  .slide.video .playbig {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    border: 0; background: rgba(0,0,0,.35); color: #fff; font-family: inherit; font-size: 60px; cursor: pointer;
  }
  .slide.video .playbig span { width: 200px; height: 200px; border-radius: 50%; background: var(--c); display: flex; align-items: center; justify-content: center; font-size: 96px; padding-left: 16px; }
  .slide.video .endcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: var(--c); font-size: 76px; }
  .slide.video .endcard button { font-family: inherit; font-size: 44px; border: 0; border-radius: 22px; padding: 18px 40px; background: #fff; color: #22262B; cursor: pointer; }
  .slide.video .vcap { position: absolute; left: 230px; right: 230px; top: 725px; display: flex; justify-content: space-between; align-items: baseline; }
  .slide.video .vcap b { font-size: 56px; font-weight: 400; }
  .slide.video .vcap small { font-size: 34px; color: #C9CED4; }
  /* 퀴즈 정답이 나올 때 한 번 튀어 오르기 */
  .slide.quiz.reveal .ox span.on { animation: okpop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes okpop { from { transform: scale(.6); } to { transform: scale(1.08); } }


  /* ---------- 교육 기록 ---------- */
  .head-btns { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .rec-btn { margin: 0; min-height: 64px; font-size: 1.1rem; }
  button.big-link { border: 2px solid var(--line); cursor: pointer; font-size: 1rem; }
  .rec-form { display: grid; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .rec-form label { display: grid; gap: 6px; font-weight: 700; }
  .rec-form .opt { font-weight: 400; color: var(--muted); font-size: .9rem; }
  .rec-form input, .rec-form textarea { font: inherit; font-weight: 400; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; min-height: 52px; }
  .rec-form input:focus, .rec-form textarea:focus { outline: none; border-color: var(--c); }
  .rec-form textarea { line-height: 1.6; resize: vertical; }
  .row3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .form-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .form-actions .big-link { margin: 0; }
  .log-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 20px; align-items: center; }
  .log-actions .big-link { margin: 0; }
  .log-sheet { width: 100%; max-width: 820px; border-collapse: collapse; background: #fff; font-size: 1rem; table-layout: fixed; }
  .log-sheet td { border: 1.5px solid #333; padding: 10px 12px; vertical-align: middle; }
  .log-sheet .k { text-align: center; width: 120px; background: #FAFAF7; }
  .log-sheet .ttl { font-size: 1.8rem; font-weight: 800; text-align: center; letter-spacing: .2em; height: 90px; }
  .log-sheet .sign { width: 54px; }
  .log-sheet .signbox { height: 56px; }
  .log-sheet .long { vertical-align: top; line-height: 1.7; }
  .log-sheet .photo { height: 120px; color: var(--muted); text-align: center; }
  .table-wrap { overflow-x: auto; }
  .rec-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
  .rec-table th, .rec-table td { padding: 14px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  .rec-table th { background: #EFEBE3; font-size: .95rem; }
  .rec-table .acts { white-space: nowrap; text-align: right; }
  .mini-btn { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; margin-left: 6px; }
  .mini-btn.danger { background: #E5484D; border-color: #E5484D; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .chip { display: inline-flex !important; align-items: center; gap: 10px; min-height: 56px; padding: 0 18px; border: 2px solid var(--line); border-radius: 14px; background: #fff; font-weight: 700; cursor: pointer; }
  .chip input { width: 24px; height: 24px; min-height: 0 !important; margin: 0; accent-color: var(--c); }
  .lesson-switch { margin: 0 0 18px; }
  /* 연간 계획표 · 이수 현황표 */
  .home-tools { display: flex; flex-wrap: wrap; gap: 12px; margin: -12px 0 28px; }
  .home-tools .big-link { margin: 0; }
  .plan-set { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; margin-bottom: 12px; }
  .plan-set label { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .plan-set select { font: inherit; min-height: 56px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
  .plan-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
  .plan-table th, .plan-table td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .plan-table thead th { background: #EFEBE3; font-size: .95rem; }
  .plan-table tbody th { white-space: nowrap; width: 90px; }
  .plan-table .num { white-space: nowrap; text-align: right; width: 90px; }
  .plan-table .dates { font-size: .95rem; line-height: 1.6; }
  .plan-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .plan-item { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; text-align: left; font-size: .95rem; }
  .plan-item .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .plan-item.done { border-color: #2DB86E; background: #EAF7EF; }
  .plan-item .ok { color: #1B7F47; font-weight: 700; }
  .pill { white-space: nowrap; display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 700; font-size: .95rem; }
  .pill.ok { background: #E3F4EA; color: #1B7F47; }
  .pill.no { background: #FFF1D6; color: #8A5A00; }
  @media print {
    .topbar, .no-print, .crumbs, .toast { display: none !important; }
    body { background: #fff; }
    .plan-table th, .plan-table td { border: 1px solid #555; }
    .plan-item { border: 0; min-height: 0; padding: 0 8px 0 0; }
  }
  .backup-box { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .chip.on { border-color: var(--c); background: var(--c); color: #fff; }
  .chip:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #22262B; color: #fff; padding: 16px 22px; border-radius: 12px; z-index: 200; max-width: 90vw; }

  /* ---------- 발표 모드 ---------- */
  .stage { position: fixed; inset: 0; z-index: 100; background: #15181C; display: flex; align-items: center; justify-content: center; }
  .stage .frame { position: relative; }
  .stage .frame .slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .stage .ctrl { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px; opacity: .25; transition: opacity .2s; }
  .stage:hover .ctrl, .stage .ctrl:focus-within { opacity: 1; }
  .stage .ctrl button { min-height: 52px; min-width: 52px; padding: 0 18px; border: 0; border-radius: 12px; background: #2E333A; color: #fff; font-size: 1rem; font-weight: 700; }
  .stage .count { color: #C9CED4; font-weight: 700; min-width: 80px; text-align: center; }
  .stage .note { position: fixed; left: 20px; right: 20px; top: 16px; background: #FFF7D6; color: #3A2E00; border-radius: 12px; padding: 12px 18px; font-size: 1.05rem; display: none; }
  .stage.show-note .note:not(:empty) { display: block; }
  @media (max-width: 720px) {
    .sheet-preview { grid-template-columns: 1fr; }
    .flow-list li { grid-template-columns: 70px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .footer-note { margin-top: 40px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">6대 의무교육 도우미<small>지역아동센터 아동 안전교육 (연 44시간)</small></div>
  <button class="home-btn" onclick="go('#home')">🏠 처음으로</button>
</header>

<main id="app"></main>

<script src="data/areas.js"></script>
<script src="data/hwpx-template.js"></script>
<script>
  /* ---------------- 데이터 ---------------- */
  const DATA = window.SAFETY_DATA;
  const LEVELS = [
    { id: "low",  icon: "🐣", title: "저학년", desc: "초등 1~3학년" },
    { id: "high", icon: "🦁", title: "고학년", desc: "초등 4~6학년 (중학생 포함)" },
    { id: "mix",  icon: "🤝", title: "함께",   desc: "저학년과 고학년이 같이 들어요" }
  ];
  const STORE_KEY = "seh-records-v1";
  /* 진행 계산: 교육 기록 1건 = 수업 1회 = 1시간(1차시) 인정. 별표 6의 'N시간 이상'은 'N회 이상'으로 보여 줘요.
     (별표 6 원문 시간은 data/areas.json에 그대로 두고, 세는 방법만 정한 거예요) */
  const SESSION_HOURS = 1;
  const SESSION_NOTE = "수업 1회를 1시간(1차시)으로 세요";

  /* 교육 기록 (기록 기능은 5주차에 만들 예정. 지금은 읽기만) */
  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch (e) { return []; }
  }
  function thisYear(records) {
    const y = new Date().getFullYear();
    return records.filter(r => String(r.date || "").startsWith(String(y)));
  }
  function areaStats(area, records) {
    const rs = thisYear(records).filter(r => r.areaId === area.id);
    const hours = rs.length * SESSION_HOURS;   /* 수업 1회 = 1시간(1차시)으로 셈. 분은 계산에 쓰지 않아요 */
    const doneTopics = new Set(rs.map(r => baseTopicId(r.areaId, r.topicId)));
    const doneLessons = new Set(rs.map(r => r.topicId));
    /* 주기는 해가 바뀌어도 이어져요: 지난해 12월에 했으면 1월에도 '주기 지키는 중' */
    const last = records.filter(r => r.areaId === area.id).map(r => r.date).sort().pop() || null;
    return { hours, doneTopics, doneLessons, last };
  }
  /* 다음 교육 기한: 마지막 교육한 달 + 주기 */
  function dueMonth(last, cycle) {
    const d = new Date(last); d.setDate(1); d.setMonth(d.getMonth() + cycle);
    return d;
  }
  function monthsSince(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr), n = new Date();
    return (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth());
  }
  function fmtHours(h) { return Number.isInteger(h) ? String(h) : h.toFixed(1); }

  /* ---------------- 화면 이동 ---------------- */
  function go(hash) { location.hash = hash; }
  /* 주소 뒤 #이름 읽기: #area-traffic, #area-traffic-low, #topic-traffic-traffic-e-02-low */
  function parseHash() {
    const h = location.hash.replace(/^#/, "");
    if (!h || h === "home" || h.startsWith("/")) return [];
    const p = h.split("-");
    if (p[0] === "area") return ["area", p[1], p[2]].filter(Boolean);
    if (h === "records" || h === "plan" || h === "report") return [h];
    if ((p[0] === "log" || p[0] === "edit") && p[1]) return [p[0], p.slice(1).join("-")];
    if (p[0] === "write" && p.length >= 4) return ["write", p[1], p.slice(2, -1).join("-"), p[p.length - 1]];
    if ((p[0] === "topic" || p[0] === "pick") && p.length >= 4) return [p[0], p[1], p.slice(2, -1).join("-"), p[p.length - 1]];
    return ["?"];
  }
  window.addEventListener("hashchange", render);

  const $app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function crumbs(items) {
    return `<nav class="crumbs">` + items.map((it, i) =>
      (i ? " › " : "") + (it.hash ? `<button onclick="go('${it.hash}')">${esc(it.label)}</button>` : `<span>${esc(it.label)}</span>`)
    ).join("") + `</nav>`;
  }

  /* 1) 첫 화면: 영역 고르기 */
  function viewHome() {
    const records = loadRecords();
    const total = DATA.meta.totalHours;
    let doneHours = 0;
    const cards = DATA.areas.map(a => {
      const st = areaStats(a, records);
      doneHours += Math.min(st.hours, a.requiredHours);
      const pct = Math.min(100, st.hours / a.requiredHours * 100);
      const m = monthsSince(st.last);
      let notice;
      if (st.last === null) notice = `<span class="notice">아직 한 적이 없어요</span>`;
      else if (m >= a.cycleMonths) notice = `<span class="notice">${a.cycleMonths}개월이 지났어요 · 이번 달에 해요</span>`;
      else { const due = dueMonth(st.last, a.cycleMonths); due.setMonth(due.getMonth() - 1);
        notice = `<span class="notice ok">주기 지키는 중 · ${due.getFullYear() !== new Date().getFullYear() ? due.getFullYear() + "년 " : ""}${due.getMonth() + 1}월까지 한 번 더</span>`; }
      return `
        <button class="card" style="--c:${a.color}" onclick="go('#area-${a.id}')">
          <span class="icon">${a.icon}</span>
          <span class="title">${esc(a.shortName)}</span>
          <span class="meta">${a.cycleMonths}개월마다 · 올해 ${fmtHours(st.hours)} / ${a.requiredHours}회</span>
          <span class="mini-bar"><div style="width:${pct}%"></div></span>
          ${notice}
        </button>`;
    }).join("");
    const pct = Math.min(100, doneHours / total * 100);
    return `
      <h1>오늘은 어떤 교육을 할까요?</h1>
      <p class="lead">교육할 영역을 눌러 주세요.</p>
      ${backupBox()}
      <div class="progress-box">
        <div class="progress-num">${fmtHours(doneHours)} <span>/ ${total}회</span></div>
        <div class="bar" aria-label="올해 진행률"><div style="width:${pct}%"></div></div>
        <div class="meta">${new Date().getFullYear()}년 진행<br><small>${SESSION_NOTE}</small></div>
        <button class="big-link ghost" onclick="go('#records')">📋 교육 기록 ${loadRecords().length}건</button>
      </div>
      <div class="home-tools">
        <button class="big-link ghost" onclick="go('#plan')">📅 연간 계획표</button>
        <button class="big-link ghost" onclick="go('#report')">📊 이수 현황표</button>
      </div>
      <div class="grid">${cards}</div>
      <p class="footer-note">기준: ${esc(DATA.meta.basis)} · 확인일 ${esc(DATA.meta.checkedAt)}</p>`;
  }

  /* 2) 대상 고르기 */
  function viewLevel(area) {
    const cards = LEVELS.map(l => `
      <button class="card level" style="--c:${area.color}" onclick="go('#area-${area.id}-${l.id}')">
        <span class="icon">${l.icon}</span>
        <span class="title">${l.title}</span>
        <span class="meta">${l.desc}</span>
      </button>`).join("");
    return crumbs([{ label: "처음", hash: "#home" }, { label: area.shortName }]) + `
      <h1>${area.icon} ${esc(area.shortName)}</h1>
      <p class="lead">누구와 함께 교육하나요?</p>
      <div class="levels">${cards}</div>`;
  }

  /* 3) 주제 고르기 */
  function viewTopics(area, level) {
    const lv = LEVELS.find(l => l.id === level);
    const st = areaStats(area, loadRecords());
    const topics = area.topics.elementary;
    const firstUndone = topics.find(t => !st.doneTopics.has(t.id));
    const cards = topics.map(t => {
      const done = st.doneTopics.has(t.id);
      const badge = done ? `<span class="badge done">✔ 올해 했어요</span>`
                  : (firstUndone && t.id === firstUndone.id ? `<span class="badge rec">⭐ 추천</span>` : "");
      const ex = t.extras || [];
      return `
        <button class="card topic" style="--c:${area.color}" onclick="go('#${ex.length ? "pick" : "topic"}-${area.id}-${t.id}-${level}')">
          ${badge}
          <span class="no">${t.no}</span>
          <span class="title">${esc(t.title)}</span>
          ${ex.length ? `<span class="meta">수업 ${ex.length + 1}개 · ${ex.map(x => x.icon + " " + esc(x.title)).join(" ")}</span>` : ""}
        </button>`;
    }).join("");
    return crumbs([{ label: "처음", hash: "#home" }, { label: area.shortName, hash: `#area-${area.id}` }, { label: lv.title }]) + `
      <h1>어떤 주제로 할까요?</h1>
      <p class="lead">${esc(area.shortName)} · ${lv.title} — 운영지침(별표 6)에 나온 주제예요. ⭐ 추천은 올해 아직 안 한 주제 중 첫 번째예요.</p>
      <div class="grid">${cards}</div>`;
  }

  /* 3-1) 수업 고르기: 추가 수업이 있는 주제 (예: 자연재난 → 기본·지진·폭설·한파 …) */
  function viewPick(area, topic, level) {
    const lv = LEVELS.find(l => l.id === level);
    const st = areaStats(area, loadRecords());
    const cards = lessonTopics(topic).map(t => {
      const L = contentFor(t, level).data;
      const icon = t.extraId ? t.icon : "📘";
      const name = t.extraId ? t.subTitle : "기본 수업";
      const sub = L ? L.slides[0].title : "";
      return `
        <button class="card topic" style="--c:${area.color}" onclick="go('#topic-${area.id}-${t.id}-${level}')">
          ${st.doneLessons.has(t.id) ? `<span class="badge done">✔ 올해 했어요</span>` : ""}
          <span class="icon">${icon}</span>
          <span class="title">${esc(name)}</span>
          <span class="meta">${esc(sub)}</span>
        </button>`;
    }).join("");
    return crumbs([{ label: "처음", hash: "#home" }, { label: area.shortName, hash: `#area-${area.id}` },
                   { label: lv.title, hash: `#area-${area.id}-${level}` }, { label: topic.title }]) + `
      <h1>${area.icon} ${esc(topic.title)}</h1>
      <p class="lead">어떤 수업을 할까요? 모두 운영지침(별표 6)의 이 주제로 기록되고, 이수 횟수도 ${esc(area.shortName)}에 쌓여요.</p>
      <div class="grid">${cards}</div>`;
  }

  /* 4) 수업 화면 */
  let lessonTab = "slides";
  function contentFor(topic, level) {
    const c = topic.content || {};
    if (c[level]) return { data: c[level], note: "" };
    if (level === "mix" && c.low) return { data: c.low, note: "함께 교육할 때는 저학년 자료로 진행하고, 고학년에게 퀴즈의 이유를 설명하는 역할을 맡겨 보세요." };
    return { data: null, note: "" };
  }
  /* 슬라이드를 발표 단계로 펼치기 (퀴즈는 문제 → 정답 순서) */
  function buildSteps(slides) {
    const steps = [];
    slides.forEach((sl, i) => {
      if (sl.type === "quiz") sl.items.forEach((it, k) => {
        steps.push({ sl, i, item: it, k, reveal: false });
        steps.push({ sl, i, item: it, k, reveal: true });
      });
      else steps.push({ sl, i });
    });
    return steps;
  }
  function slideHTML(st, area) {
    const sl = st.sl, c = `--c:${area.color}`;
    const img = sl.image ? `<div class="img"><img src="${esc(sl.image)}" alt=""></div>` : "";
    switch (sl.type) {
      case "cover":
        return `<div class="slide cover" style="${c}">${img}<div class="txt"><div class="kicker">${esc(area.shortName)}</div><h2>${esc(sl.title)}</h2><p>${esc(sl.text)}</p></div></div>`;
      case "promise":
        const tl = sl.title.length, tsz = tl <= 2 ? 190 : tl === 3 ? 160 : tl === 4 ? 130 : tl <= 6 ? 108 : 88;
        return `<div class="slide promise" style="${c}">${img}<div class="txt"><div class="num">${sl.no}</div><h2 style="font-size:${tsz}px">${esc(sl.title)}</h2><p>${esc(sl.text)}</p></div></div>`;
      case "quiz": {
        const it = st.item || sl.items[0], n = (st.k || 0) + 1;
        const on = a => st.reveal ? (it.a === a ? "on" : "off") : "";
        const okc = it.a === "O" ? "#2DB86E" : "#E5484D";
        return `<div class="slide quiz${st.reveal ? " reveal" : ""}${it.explain ? " has-ex" : ""}" style="${c};--okc:${okc}"><div class="qbox"><div class="qno">O X 퀴즈 ${n} / ${sl.items.length}</div><div class="q" style="font-size:${it.q.length > 26 ? 70 : 84}px">${esc(it.q)}</div></div>
          <div class="ox"><span class="${on("O")}">O</span><span class="${on("X")}">X</span></div><div class="why">${esc(it.a)} · ${esc(it.why)}</div>${it.explain ? `<div class="ex">${esc(it.explain)}</div>` : ""}</div>`;
      }
      case "video": {
        const thumb = `https://i.ytimg.com/vi/${esc(sl.youtubeId)}/hqdefault.jpg`;
        return `<div class="slide video" style="${c}"><div class="vbox" data-yt="${esc(sl.youtubeId)}"><img src="${thumb}" alt="" onerror="this.remove()">
          ${EMBED_OK ? `<button class="playbig" onclick="event.stopPropagation();playVideo(this)"><span>▶</span>영상 보기</button>`
                     : `<a class="playbig" href="https://www.youtube.com/watch?v=${esc(sl.youtubeId)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="text-decoration:none"><span>▶</span>유튜브에서 보기</a>`}</div>
          <div class="vcap"><b>${esc(sl.title)}</b><small>${esc(sl.source)}</small></div></div>`;
      }
      case "wrap":
        const words = sl.words || [["✋", "서다"], ["👀", "보다"], ["🚶", "걷다"]];
        const fs = w => w.length <= 2 ? 140 : w.length === 3 ? 112 : w.length === 4 ? 88 : 72;
        return `<div class="slide wrap" style="${c}"><div class="words">${words.map(([e, w]) => `<div><small>${e}</small><span style="font-size:${fs(w)}px">${esc(w)}</span></div>`).join("")}</div><div class="sub">다 같이 외쳐요!</div></div>`;
      default:
        return `<div class="slide ${esc(sl.type)}" style="${c}">${img}<div class="txt"><h2>${esc(sl.title)}</h2><p>${esc(sl.text || "")}</p></div></div>`;
    }
  }
  function viewLesson(area, topic, level) {
    const lv = LEVELS.find(l => l.id === level);
    const { data: L, note } = contentFor(topic, level);
    const base = topic.baseId ? area.topics.elementary.find(x => x.id === topic.baseId) : topic;
    const siblings = base.extras && base.extras.length ? lessonTopics(base) : [];
    const head = crumbs([{ label: "처음", hash: "#home" }, { label: area.shortName, hash: `#area-${area.id}` },
                   { label: lv.title, hash: `#area-${area.id}-${level}` },
                   ...(siblings.length ? [{ label: base.title, hash: `#pick-${area.id}-${base.id}-${level}` }, { label: topic.subTitle || "기본 수업" }] : [{ label: topic.title }])])
      + (siblings.length ? `<div class="chips lesson-switch" style="--c:${area.color}">` + siblings.map(s =>
          `<button class="chip${s.id === topic.id ? " on" : ""}" onclick="go('#topic-${area.id}-${s.id}-${level}')">${s.extraId ? s.icon + " " + esc(s.subTitle) : "📘 기본 수업"}</button>`).join("") + `</div>` : "");
    const linksHTML = topic.links && topic.links.length
      ? `<ul class="links">` + topic.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="org">${esc(l.org)} · 확인 ${esc(l.checkedAt)}</span><span class="t">${esc(l.title)}</span></a></li>`).join("") + `</ul>`
      : `<div class="box">아직 연결한 자료가 없어요. 이 영역은 ${esc(area.sourceOrgs.join(", "))} 누리집에서 찾아볼 수 있어요.</div>`;
    if (!L) {
      return head + `<h1>${area.icon} ${esc(topic.title)}</h1><p class="lead">${esc(area.shortName)} · ${lv.title}</p>
        <div class="placeholder" style="margin-bottom:28px"><strong>이 주제의 수업 자료는 아직 만들고 있어요</strong>다른 학년을 고르거나 자료 링크를 참고해 주세요.</div>
        <h2>자료 링크</h2>${linksHTML}`;
    }
    const steps = buildSteps(L.slides);
    const tabs = [["slides", "시각자료"], ["flow", "수업 흐름"], ["sheet", "활동지"], ["links", "자료 링크"], ["ai", "🤖 AI에게 부탁하기"]];
    let body = "";
    if (lessonTab === "slides") {
      body = `<div class="thumbs">` + L.slides.map((sl, i) => {
        const si = steps.findIndex(s => s.i === i);
        /* 작은 그림 안에는 버튼을 넣을 수 없어서(버튼 안의 버튼) 영상 재생 버튼을 글자로 바꿔요 */
        const mini = slideHTML(steps[si], area).replace(/<(button|a) class="playbig"[^>]*>([\s\S]*?)<\/\1>/, '<span class="playbig">$2</span>');
        return `<button class="thumb" style="--c:${area.color}" onclick="startShow(${si})"><div class="mini" data-mini>${mini}</div><span class="cap">${i + 1}. ${esc(sl.title)}</span></button>`;
      }).join("") + `</div>`;
    } else if (lessonTab === "flow") {
      const total = L.lessonFlow.reduce((s, f) => s + f.minutes, 0);
      const shades = [0.55, 1, 0.8, 0.9, 0.65];
      body = `<div class="flow-bar">` + L.lessonFlow.map((f, i) => `<div style="flex:${f.minutes};background:${area.color};filter:brightness(${shades[i % shades.length] + 0.2})">${f.minutes}분</div>`).join("") + `</div>
        <ol class="flow-list">` + L.lessonFlow.map(f => `<li><div class="min">${f.minutes}<small>분</small></div><div><b>${esc(f.step)}</b><br>${esc(f.do)}<br><span class="meta">슬라이드 ${f.slides.join(", ")}</span></div></li>`).join("") + `</ol>
        <div class="two-col"><div class="box"><h3>준비물</h3><ul>${L.materials.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>
        <div class="box warn"><h3>안전 주의</h3>${esc(L.safetyNote)}</div></div>
        ${L.slides.filter(s => s.type === "quiz").map(s => `<div class="box quiz-key"><h3>O X 퀴즈 정답과 해설</h3><ol>${s.items.map(q => `<li><b>${esc(q.q)}</b> <span class="ans ans-${q.a}">${q.a}</span><br>${esc(q.why)}${q.explain ? `<br><span class="meta">${esc(q.explain)}</span>` : ""}</li>`).join("")}</ol></div>`).join("")}
        <p class="meta" style="margin-top:16px">전체 ${total}분</p>`;
    } else if (lessonTab === "sheet") {
      const prev = L.worksheet.replace(/\.pdf$/, ".png");
      body = `<div class="sheet-preview"><img src="${esc(prev)}" alt="활동지 미리보기" onerror="this.style.display='none'">
        <div><h2 style="margin-top:0">인쇄용 활동지 (A4 1장)</h2><p>교육을 마치고 나눠 주세요. 집에서 가족과 함께 해도 좋아요.</p>
        ${window.NO_FILES ? `<div class="box">미리보기 사이트에서는 파일을 받을 수 없어요. 활동지 PDF와 선생님용 PPT는 프로젝트 폴더의 <b>worksheets</b>, <b>slides</b> 폴더에 있어요.</div>` :
        `<a class="big-link" style="--c:${area.color};background:${area.color}" href="${esc(L.worksheet)}" target="_blank">🖨️ 활동지 열기</a>

      <div class="lesson-head"><div><h1>${area.icon} ${esc(topic.title)}</h1><p class="lead" style="margin:0">${esc(area.shortName)} · ${lv.title} · ${L.minutes}분 <span class="status-pill">${esc(L.status)}</span></p></div>

      <div class="goal" style="--c:${area.color}"><b>오늘의 목표</b> ${esc(L.goal)}${note ? `<br><span class="meta">${esc(note)}</span>` : ""}</div>
      <div class="tabs" role="tablist" style="--c:${area.color}">` + tabs.map(([id, label]) =>
        `<button class="tab" role="tab" aria-selected="${lessonTab === id}" onclick="lessonTab='${id}';render()">${label}</button>`).join("") + `</div>
      ${body}`;
  }

  /* ---------- AI에게 부탁하기 (API 키 없이) ----------
     프로그램은 부탁 글만 만들어요. 선생님이 복사해서 무료 ChatGPT·Claude 등에 붙여 넣어요.
     그래서 비용이 들지 않고, 아이 정보가 프로그램 밖으로 저절로 나가지 않아요. */
  const AI_CHIPS = [
    ["mix", "저학년과 고학년이 함께 들어요"],
    ["small", "교실이 좁아서 크게 움직이기 어려워요"],
    ["short", "아이들 집중 시간이 짧아요"],
    ["few", "인원이 적어요 (5명 안팎)"],

  function lessonText(topic, level) {
    const L = contentFor(topic, level).data;
    const sl = L.slides.map((s, i) => {
      if (s.type === "quiz") return `${i + 1}. [O X 퀴즈] ` + s.items.map(q => `${q.q} → ${q.a} (${q.why})`).join(" / ");
      if (s.type === "wrap") return `${i + 1}. [마무리 구호] ` + s.words.map(w => w[1]).join("·");
      return `${i + 1}. [${s.title}] ${String(s.text || "").replace(/\n/g, " ")}`;
    });
    return [
      `목표: ${L.goal}`,
      `수업 흐름 (${L.minutes}분):`, ...L.lessonFlow.map(f => `- ${f.step} ${f.minutes}분: ${f.do}`),
      `준비물: ${L.materials.join(", ")}`,
      `슬라이드:`, ...sl,
      `안전 주의: ${L.safetyNote}`

  }
  function aiPrompt(areaId, topicId, level) {

    return [

      ``,

      `- 「아동복지법」 시행령 별표 6의 주제("${t.title}")는 바꾸지 말아 주세요.`,
      `- 아이들 눈높이의 쉬운 말로, 한 문장은 짧게 써 주세요.`,
      `- 신고·상담 번호는 112(경찰·아동학대 신고), 129, 182, 117, 1342, 119 중 맞는 것만 쓰고, 새 번호를 만들지 말아 주세요.`,
      ...(sensitive ? [`- 자극적이거나 구체적인 피해 묘사는 넣지 말고, 피해 아동을 탓하는 말은 쓰지 말아 주세요. "말해 줘서 고마워, 네 잘못이 아니야"라는 메시지를 지켜 주세요.`] : []),
      `- 무섭게 겁주는 방식이 아니라, 할 수 있는 행동을 알려 주는 방식으로 써 주세요.`,

          부탁 글을 복사해서 ChatGPT나 Claude 같은 무료 AI 대화창에 붙여 넣으면 돼요.</div>

            <div class="chips">${AI_CHIPS.map(([k, s]) => `<label class="chip"><input type="checkbox" value="${k}"${level === "mix" && k === "mix" ? " checked" : ""}> ${esc(s)}</label>`).join("")}</div></div>
          <label>3. 더 알려 줄 것 <span class="opt">(적지 않아도 돼요. 아이 이름은 적지 마세요)</span>
            <input id="aiExtra" placeholder="예: 다음 주에 소방서 견학을 가요"></label>
          <label>AI에게 보낼 부탁 글 <span class="opt">(직접 고쳐도 돼요)</span>
            <textarea id="aiPrompt" rows="12" oninput="event.stopPropagation()"></textarea></label>
          <div class="form-actions">
            <button type="button" class="play-btn" style="--c:${area.color}" onclick="copyText(this, document.getElementById('aiPrompt').value)">📋 부탁 글 복사하기</button>

        </form>

  /* ---------- 유튜브 재생: 선생님이 고른 영상만, 끝나면 가리기 ---------- */
  /* 파일로 열었거나(file:) 미리보기 사이트처럼 영상 넣기가 막힌 곳에서는 유튜브 링크로 대신 열어요 */
  const EMBED_OK = location.protocol.startsWith("http") && !window.NO_EMBED;
  let ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise(res => {
      if (window.YT && window.YT.Player) return res();
      window.onYouTubeIframeAPIReady = res;
      const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api";
      sc.onerror = () => res("fail"); document.head.appendChild(sc);
    });
    return ytReady;
  }
  async function playVideo(btn) {
    const box = btn.closest(".vbox"), id = box.dataset.yt;
    const r = await loadYT();
    if (r === "fail" || !window.YT) { box.innerHTML = `<div class="endcard">인터넷 연결을 확인해 주세요</div>`; return; }
    box.innerHTML = `<div id="ytp"></div>`;
    new YT.Player("ytp", {
      width: "100%", height: "100%", videoId: id, host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3 },
      events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED) showEnd(box, id); } }
    });
  }
  function showEnd(box, id) {
    box.innerHTML = `<div class="endcard">영상 끝! 잘 봤어요<button onclick="event.stopPropagation();this.closest('.vbox').innerHTML='<button class=&quot;playbig&quot; onclick=&quot;event.stopPropagation();playVideo(this)&quot;><span>▶</span>다시 보기</button>'">🔁 다시 보기</button></div>`;
  }

  /* 글이 넘치면 슬라이드 글자를 조금씩 줄여서 맞춰요 */
  function fitSlide(slide) {
    if (!slide) return;
    const boxes = [slide.querySelector(".txt")].filter(Boolean);
    boxes.forEach(box => {
      let k = 0;
      while (box.scrollHeight > box.clientHeight + 2 && k < 14) {
        box.querySelectorAll("h2, p, .kicker").forEach(el => {
          const fs = parseFloat(getComputedStyle(el).fontSize); el.style.fontSize = (fs * 0.92) + "px";
        });
        k++;
      }
    });
  }
  /* 미리보기 슬라이드 크기 맞추기 */
  function fitMinis() {
    document.querySelectorAll("[data-mini]").forEach(box => {
      const s = box.firstElementChild; if (s) { fitSlide(s); s.style.transform = `scale(${box.clientWidth / 1600})`; }
    });
  }
  window.addEventListener("resize", () => { fitMinis(); fitStage(); });

  /* ---------- 발표 모드 ---------- */
  let show = null;
  function currentLesson() {
    const p = parseHash();
    const a = DATA.areas.find(x => x.id === p[1]);
    const t = a && findTopic(a.id, p[2]).t;
    const L = t && contentFor(t, p[3]).data;
    return L ? { area: a, L } : null;
  }
  function startShow(i) {
    const cur = currentLesson(); if (!cur) return;
    show = { area: cur.area, steps: buildSteps(cur.L.slides), i: i || 0 };
    const el = document.createElement("div");
    el.className = "stage"; el.id = "stage";
    el.innerHTML = `<div class="note" id="note"></div><div class="frame" id="frame"></div>
      <div class="ctrl"><button onclick="move(-1)" aria-label="이전">◀ 이전</button><span class="count" id="count"></span>
      <button onclick="move(1)" aria-label="다음">다음 ▶</button><button onclick="toggleNote()">선생님 메모</button><button onclick="endShow()">✕ 끝내기</button></div>`;
    el.addEventListener("click", e => { if (e.target.closest(".vbox")) return; if (e.target === el || e.target.closest(".frame")) move(1); });
    document.body.appendChild(el);
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    drawShow();
  }
  function drawShow() {
    const st = show.steps[show.i];
    document.getElementById("frame").innerHTML = slideHTML(st, show.area);
    document.getElementById("count").textContent = `${st.i + 1} / ${show.steps[show.steps.length - 1].i + 1}`;
    const quizNote = st.sl.type === "quiz" && st.item ? `정답 ${st.item.a} — ${st.item.why}${st.item.explain ? " " + st.item.explain : ""}` : "";
    document.getElementById("note").textContent = quizNote ? "선생님 메모: " + quizNote : st.sl.teacher ? "선생님 메모: " + st.sl.teacher : "";
    fitStage();
  }
  function fitStage() {
    const f = document.getElementById("frame"); if (!f) return;
    const sc = Math.min(window.innerWidth / 1600, (window.innerHeight - 10) / 900);
    f.style.width = 1600 * sc + "px"; f.style.height = 900 * sc + "px";
    const s = f.firstElementChild; if (s) { fitSlide(s); s.style.transform = `scale(${sc})`; }
  }
  function move(d) {
    if (!show) return;
    show.i = Math.max(0, Math.min(show.steps.length - 1, show.i + d));
    drawShow();
  }
  function toggleNote() { document.getElementById("stage").classList.toggle("show-note"); }
  function endShow() {
    const el = document.getElementById("stage"); if (el) el.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    show = null;
  }
  document.addEventListener("keydown", e => {
    if (!show) return;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); move(1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); move(-1); }
    else if (e.key === "Escape") endShow();
    else if (e.key === "n" || e.key === "N" || e.key === "ㅜ") toggleNote();
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && show) fitStage(); });

  function notFound() {
    return `<div class="placeholder"><strong>화면을 찾을 수 없어요</strong>위의 "처음으로" 버튼을 눌러 주세요.</div>`;
  }

  /* ================= 교육 기록 (5주차) ================= */
  const PREF_KEY = "seh-prefs-v1";
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } }
  function savePrefs(p) { try { localStorage.setItem(PREF_KEY, JSON.stringify(Object.assign(loadPrefs(), p))); } catch (e) {} }
  /* 기록 백업 알림: 기록이 3건 이상인데 30일 넘게 '기록 파일로 내보내기'를 안 했으면 알려요 */
  function backupDue() {
    const n = loadRecords().length; if (n < 3 || window.NO_FILES) return false;
    const last = loadPrefs().lastBackupAt;
    return !last || (Date.now() - new Date(last).getTime()) / 864e5 >= 30;
  }
  function backupBox() {
    if (!backupDue()) return "";
    const last = loadPrefs().lastBackupAt;
    return `<div class="box warn backup-box"><div><b>💾 기록을 파일로 저장해 두세요</b><br>${last ? `마지막 저장: ${fmtDate(last.slice(0, 10))}` : "아직 한 번도 저장하지 않았어요"}. 브라우저 기록을 지우면 교육 기록도 함께 지워질 수 있어요.</div>
      <button class="big-link ghost" style="margin:0" onclick="exportRecords();render()">⬇️ 지금 기록 파일 저장하기</button></div>`;
  }
  function backupReminder() { if (backupDue()) alertBox("💾 기록이 쌓였어요. '교육 기록' 화면에서 기록 파일로 저장해 두세요."); }
  function saveRecords(list) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  }
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const fmtDate = s => { const [y, m, d] = String(s).split("-"); return y && m && d ? `${y}년 ${Number(m)}월 ${Number(d)}일` : s; };
  const levelName = lv => (LEVELS.find(l => l.id === lv) || {}).title || lv;
  /* 주제의 수업들: 기본 수업 + 추가 수업(extras). 추가 수업 id는 "<주제id>-<추가id>" (tools/lib/common.js와 같은 규칙) */
  function lessonTopics(t) {
    return [t, ...(t.extras || []).map(ex => Object.assign({}, t, ex, {
      id: `${t.id}-${ex.id}`, baseId: t.id, extraId: ex.id, subTitle: ex.title,
      title: `${t.title} (${ex.title})`, links: [...(ex.links || []), ...(t.links || [])]
    }))];
  }
  function findTopic(areaId, topicId) {
    const a = DATA.areas.find(x => x.id === areaId);
    let t = null;
    if (a) for (const base of a.topics.elementary) { t = lessonTopics(base).find(x => x.id === topicId); if (t) break; }
    return { a, t };
  }
  /* 기록의 주제 id → 별표 6 주제 id (추가 수업도 원래 주제로 쳐요) */
  function baseTopicId(areaId, topicId) { const { t } = findTopic(areaId, topicId); return t ? (t.baseId || t.id) : topicId; }

  /* 진행내용: 수업 흐름을 바탕으로 일지에 쓸 문장을 만들어요 */
  function draftContent(area, topic, level, minutes) {
    const L = contentFor(topic, level).data; if (!L) return "";
    const pts = L.slides.filter(s => s.type === "promise");
    const quiz = L.slides.find(s => s.type === "quiz");
    const wrap = L.slides.find(s => s.type === "wrap");
    const words = (wrap && wrap.words ? wrap.words.map(w => w[1]) : ["서다", "보다", "걷다"]).join("·");
    const lines = [`[교육 목표] ${L.goal}`, ""];
    L.lessonFlow.forEach((f, i) => {
      lines.push(`${i + 1}. ${f.step} (${f.minutes}분): ${f.do}`);
      if (i === 1 && pts.length) pts.forEach((p, k) => lines.push(`   ${"①②③④"[k]} ${p.title} – ${p.text.replace(/\n/g, " ")}`));
      if (quiz && f.slides.some(n => L.slides[n - 1] && L.slides[n - 1].type === "quiz"))
        lines.push(`   O X 퀴즈 ${quiz.items.length}문항으로 이해 정도를 확인함`);
    });
    lines.push("", `※ 「아동복지법」 시행령 별표 6 ${area.name} – ${topic.title} (${levelName(level)}, 1회)`);
    lines.push(`※ 마무리 구호: ${words}`);
    return lines.join("\n");
  }
  function draftOpinion(area, topic, level) {
    const L = contentFor(topic, level).data; if (!L) return "";
    const wrap = L.slides.find(s => s.type === "wrap");
    const words = (wrap && wrap.words ? wrap.words.map(w => w[1]) : []).join("·");
    return `아동들이 ${topic.title}에 대해 배우고 '${words}' 약속을 함께 외치며 적극적으로 참여함. O X 퀴즈에서 대부분 바르게 답하였으며, 활동지는 가정에서 보호자와 함께 하도록 안내함. (다음 교육 때 보완할 점: )`;
  }

  /* 기록하기 화면 (새로 쓰기 / 고치기 같은 화면) */
  function viewWrite(area, topic, level, rec) {

  function submitRecord(areaId, topicId, level, id, withHwpx) {
    const f = document.getElementById("recForm");
    const v = Object.fromEntries(new FormData(f).entries());
    const list = loadRecords();
    const rec = {
      id: id || ("r" + Date.now().toString(36)), date: v.date, areaId, topicId, level,
      minutes: Number(v.minutes) || 40, children: Number(v.children) || 0, names: v.names.trim(),
      place: v.place.trim(), leader: v.leader.trim(), manager: v.manager.trim(),
      materials: v.materials.trim(), content: v.content, opinion: v.opinion, savedAt: new Date().toISOString()
    };
    const i = list.findIndex(x => x.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
    savePrefs({ place: rec.place, leader: rec.leader, manager: rec.manager });
    if (!saveRecords(list)) { alertBox("저장하지 못했어요. 이 브라우저는 기록 저장이 막혀 있어요. 아래 '복사' 버튼으로 내용을 따로 보관해 주세요."); }
    go(`#log-${rec.id}`);
    if (withHwpx) { downloadHwpx(rec.id, rec); setTimeout(() => alertBox("한글 파일을 받았어요. 브라우저의 '다운로드' 폴더를 열어 보세요."), 300); }
    else setTimeout(backupReminder, 400);
  }
  function participantsText(r) {

  function recordFields(r) {

      content: r.content, opinion: r.opinion

  }

  function logPlain(id) {
    const F = recordFields(loadRecords().find(x => x.id === id));
    return [`프로그램명: ${F.program}`, `제목: ${F.title}`, `담당자: ${F.manager}`, `장소: ${F.place}`, `작성일자: ${F.date}`,
            `진행자: ${F.leader}`, `준비물: ${F.materials}`, `참여자: ${F.participants}`, "", "[진행내용]", F.content, "", "[담당자의견]", F.opinion].join("\n");
  }
  function copyText(btn, text) {
    const done = ok => { const o = btn.textContent; btn.textContent = ok ? "✔ 복사했어요" : "복사가 안 돼요. 글을 직접 선택해 주세요"; setTimeout(() => btn.textContent = o, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
    else done(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok;
  }
  function alertBox(msg) {
    const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 5000);
  }

  /* 기록 목록 */
  let pendingDelete = null;

    const list = loadRecords().slice().sort((x, y) => (y.date || "").localeCompare(x.date || ""));
    const total = thisYear(list).length * SESSION_HOURS;
    const rows = list.map(r => {
      const { a, t } = findTopic(r.areaId, r.topicId);
      const del = pendingDelete === r.id
        ? `<button class="mini-btn danger" onclick="deleteRecord('${r.id}')">정말 지울게요</button><button class="mini-btn" onclick="pendingDelete=null;render()">취소</button>`

      ${list.length ? `<div class="table-wrap"><table class="rec-table"><thead><tr><th>날짜</th><th>영역</th><th>주제</th><th>대상</th><th>인원</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="placeholder"><strong>아직 기록이 없어요</strong>수업 화면에서 "📝 교육 기록하기"를 누르면 여기에 쌓여요.</div>`}
      <div class="box" style="margin-top:24px"><h3>기록 보관하기</h3>
        <p>기록은 이 컴퓨터의 브라우저에만 저장돼요. 브라우저 기록을 지우거나 다른 컴퓨터로 옮기면 안 보여요. 가끔 파일로 내보내 두세요.</p>
        ${window.NO_FILES ? "" : `<button class="big-link ghost" onclick="exportRecords()">⬇️ 기록 파일로 내보내기</button>`}
        <label class="big-link ghost" style="cursor:pointer">⬆️ 기록 파일 불러오기<input type="file" accept=".json,application/json" style="display:none" onchange="importRecords(this)"></label>
        <span id="impMsg" class="meta"></span>

  function deleteRecord(id) { saveRecords(loadRecords().filter(r => r.id !== id)); pendingDelete = null; render(); }
  function downloadBlob(blob, name) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function exportRecords() {
    downloadBlob(new Blob([JSON.stringify({ app: "6대 의무교육 도우미", exportedAt: new Date().toISOString(), records: loadRecords() }, null, 2)], { type: "application/json" }), `교육기록_${today()}.json`);
    savePrefs({ lastBackupAt: new Date().toISOString() });
  }
  function importRecords(input) {
    const file = input.files[0]; if (!file) return;
    file.text().then(txt => {
      const data = JSON.parse(txt), incoming = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(incoming)) throw new Error("형식");
      const list = loadRecords(), ids = new Set(list.map(r => r.id));
      let added = 0; incoming.forEach(r => { if (r && r.id && r.areaId && !ids.has(r.id)) { list.push(r); added++; } });
      saveRecords(list); render();
      const m = document.getElementById("impMsg"); if (m) m.textContent = `기록 ${added}건을 불러왔어요.`;
    }).catch(() => { const m = document.getElementById("impMsg"); if (m) m.textContent = "이 파일은 불러올 수 없어요. '기록 파일로 내보내기'로 만든 파일인지 확인해 주세요."; });
  }

  /* ================= F6 연간 계획표 · 이수 현황표 ================= */
  /* 계획 설정(시작 연월, 1회 교육 시간, 대상)은 seh-prefs-v1에 기억해요 */
  function planSettings() {
    const P = loadPrefs(), now = new Date();
    return { year: Number(P.planYear) || now.getFullYear(), start: Number(P.planStart) || 1,
             level: P.planLevel || "low" };
  }
  function setPlan(key, val) { savePrefs({ [key]: val }); render(); }
  /* 영역마다 필요한 횟수(연간 시간 ÷ 1회 시간)를 12달에 고르게 나눠요.
     고르게 나누면 간격이 '12 ÷ 횟수'달이라 주기(2·3·6개월)를 넘지 않아요. 영역마다 시작을 조금씩 밀어 한 달에 몰리지 않게 해요. */
  function buildPlan(S) {
    const months = Array.from({ length: 12 }, (_, k) => { const d = new Date(S.year, S.start - 1 + k, 1); return { y: d.getFullYear(), m: d.getMonth() + 1, items: [] }; });
    DATA.areas.forEach((a, ai) => {
      const n = Math.ceil(a.requiredHours / SESSION_HOURS);
      const base = a.topics.elementary, extra = base.flatMap(t => lessonTopics(t).slice(1));
      const pool = [...base, ...extra];
      for (let i = 0; i < n; i++) {
        const k = Math.min(11, Math.floor((i + ai / DATA.areas.length) * 12 / n));
        months[k].items.push({ a, t: pool[i % pool.length] });
      }
    });
    return months;
  }
  function inPlanWindow(dateStr, S) {
    const d = new Date(dateStr), from = new Date(S.year, S.start - 1, 1), to = new Date(S.year, S.start - 1 + 12, 1);
    return d >= from && d < to;
  }
  function planTableHTML(months, S, forCopy) {
    /* 기록 1건은 계획 1칸에만 ✔ (같은 수업이 1년에 두 번 있으면 날짜 순서대로 앞 칸부터) */
    const recs = loadRecords().filter(r => inPlanWindow(r.date, S)).sort((x, y) => x.date.localeCompare(y.date));
    const used = new Set(), match = new Map();
    months.forEach(mo => mo.items.forEach(it => {
      const r = recs.find(r => !used.has(r.id) && r.areaId === it.a.id && r.topicId === it.t.id);
      if (r) { used.add(r.id); match.set(it, r); }
    }));
    const doneOf = (a, t, it) => match.get(it) || null;
    const B = forCopy ? ' style="border:1px solid #333;padding:6px;vertical-align:top"' : "";
    const rows = months.map(mo => {
      const cells = mo.items.map(it => {
        const { a, t } = it, r = doneOf(a, t, it);
        const name = t.extraId ? `${t.subTitle}` : t.title;
        return forCopy ? `${a.shortName} – ${name}${r ? " ✔" : ""}`
          : `<button class="plan-item${r ? " done" : ""}" style="--c:${a.color}" onclick="go('#topic-${a.id}-${t.id}-${S.level}')"><span class="dot"></span><b>${esc(a.shortName)}</b> ${esc(name)}${r ? ` <span class="ok">✔ ${esc(fmtDate(r.date).replace(/^\d+년 /, ""))}</span>` : ""}</button>`;
      });
      return forCopy
        ? `<tr><td${B}>${mo.y}년 ${mo.m}월</td><td${B}>${cells.join("<br>")}</td><td${B}>${mo.items.length}회</td></tr>`
        : `<tr><th>${mo.y !== S.year ? mo.y + "년 " : ""}${mo.m}월</th><td><div class="plan-items">${cells.join("")}</div></td><td class="num">${mo.items.length}회</td></tr>`;
    }).join("");
    return forCopy
      ? `<table style="border-collapse:collapse"><tr><th${B}>월</th><th${B}>교육 (영역 – 주제)</th><th${B}>횟수</th></tr>${rows}</table>`
      : `<table class="plan-table"><thead><tr><th>월</th><th>교육 (누르면 수업 화면)</th><th>횟수</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function viewPlan() {
    const S = planSettings(), months = buildPlan(S);
    const yearOpts = [-1, 0, 1].map(d => new Date().getFullYear() + d);
    const sel = (key, opts, cur) => `<select onchange="setPlan('${key}', this.value)">${opts.map(([v, l]) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${l}</option>`).join("")}</select>`;
    const per = DATA.areas.map(a => `${a.icon} ${esc(a.shortName)} ${Math.ceil(a.requiredHours / SESSION_HOURS)}회`).join(" · ");
    return crumbs([{ label: "처음", hash: "#home" }, { label: "연간 계획표" }]) + `
      <h1>📅 연간 계획표</h1>
      <p class="lead">시작 달을 고르면, 별표 6의 시간(${SESSION_NOTE})과 주기에 맞춰 12달 계획을 자동으로 짜 줘요. 한 교육을 마치고 기록하면 ✔ 표시가 붙어요.</p>
      <div class="box plan-set no-print">
        <label>시작${sel("planYear", yearOpts.map(y => [y, y + "년"]), S.year)}${sel("planStart", Array.from({ length: 12 }, (_, i) => [i + 1, (i + 1) + "월"]), S.start)}</label>
        <label>주로 하는 대상${sel("planLevel", LEVELS.map(l => [l.id, l.title]), S.level)}</label>
      </div>
      <p class="meta">필요한 횟수: ${per} (합계 ${months.reduce((s, m) => s + m.items.length, 0)}회)</p>
      <div class="table-wrap">${planTableHTML(months, S)}</div>
      <div class="form-actions no-print" style="margin-top:20px">
        <button class="play-btn" style="--c:var(--accent)" onclick="copyHtml(this, planTableHTML(buildPlan(planSettings()), planSettings(), true), planPlain())">📋 한글에 붙여 넣기용 복사</button>
        ${window.NO_FILES ? "" : `<button class="big-link ghost" onclick="window.print()">🖨️ 인쇄하기</button>`}
        <button class="big-link ghost" onclick="go('#report')">📊 이수 현황표 보기</button>
      </div>
      <p class="meta no-print">복사한 뒤 한글에서 <b>Ctrl+V</b> 하면 표로 들어가요. 계획은 예시 순서예요. 센터 일정에 맞게 바꿔서 쓰세요.</p>`;
  }
  function planPlain() {
    const S = planSettings();
    return buildPlan(S).map(mo => `${mo.y}년 ${mo.m}월\t` + mo.items.map(({ a, t }) => `${a.shortName}–${t.extraId ? t.subTitle : t.title}`).join(", ")).join("\n");
  }

  /* 이수 현황표: 올해 영역별 시간·횟수·주기 충족 여부와 교육 일자 */
  let reportYear = new Date().getFullYear();
  function reportRows(year) {
    const recs = loadRecords().filter(r => String(r.date || "").startsWith(String(year)));
    return DATA.areas.map(a => {
      const rs = recs.filter(r => r.areaId === a.id).sort((x, y) => x.date.localeCompare(y.date));
      const hours = rs.length * SESSION_HOURS;
      /* 주기 점검: 1월 1일부터 연말(올해면 오늘)까지 교육 사이 간격이 주기를 넘은 적이 있는지 */
      const end = year === new Date().getFullYear() ? new Date() : new Date(year, 11, 31);
      let gapOk = true, prev = new Date(year, 0, 1);
      for (const d of [...rs.map(r => new Date(r.date)), end]) {
        const gap = (d.getFullYear() - prev.getFullYear()) * 12 + (d.getMonth() - prev.getMonth());
        if (gap >= a.cycleMonths) gapOk = false;
        prev = d;
      }
      const list = rs.map(r => { const { t } = findTopic(r.areaId, r.topicId); return { date: r.date, title: t ? t.title : "?", minutes: r.minutes, children: r.children }; });
      return { a, rs, hours, ok: hours >= a.requiredHours, gapOk, list };
    });
  }
  function reportTableHTML(year, forCopy) {
    const rows = reportRows(year);
    const B = forCopy ? ' style="border:1px solid #333;padding:6px;vertical-align:top"' : "";
    const total = rows.reduce((s, x) => s + Math.min(x.hours, x.a.requiredHours), 0);
    const body = rows.map(x => {
      const status = x.ok ? (x.gapOk ? "충족" : "횟수 충족 · 주기 확인") : `${fmtHours(x.a.requiredHours - x.hours)}회 부족`;
      const dates = x.list.map(l => `${fmtDate(l.date).replace(/^\d+년 /, "")} ${l.title} (${l.children}명)`);
      return forCopy
        ? `<tr><td${B}>${x.a.name}</td><td${B}>${x.a.cycleMonths}개월 1회 · ${x.a.requiredHours}시간(${x.a.requiredHours}회)</td><td${B}>${x.rs.length}회</td><td${B}>${status}</td><td${B}>${dates.join("<br>") || "-"}</td></tr>`
        : `<tr><th>${x.a.icon} ${esc(x.a.shortName)}</th><td>${x.a.cycleMonths}개월에 1회 이상<br>${x.a.requiredHours}시간(${x.a.requiredHours}회) 이상</td><td class="num">${x.rs.length}회</td>
          <td><span class="pill ${x.ok && x.gapOk ? "ok" : "no"}">${status}</span></td><td class="dates">${dates.map(esc).join("<br>") || `<span class="meta">아직 없어요</span>`}</td></tr>`;
    }).join("");
    const foot = `${fmtHours(total)} / ${DATA.meta.totalHours}회`;
    return forCopy
      ? `<table style="border-collapse:collapse"><tr><th${B}>영역</th><th${B}>기준 (별표 6)</th><th${B}>이수</th><th${B}>상태</th><th${B}>교육 일자 · 주제</th></tr>${body}<tr><td${B}>합계</td><td${B}>44시간(44회)</td><td${B} colspan="3">${foot} (${SESSION_NOTE})</td></tr></table>`
      : `<table class="plan-table report"><thead><tr><th>영역</th><th>기준 (별표 6)</th><th>이수</th><th>상태</th><th>교육 일자 · 주제</th></tr></thead><tbody>${body}</tbody>
          <tfoot><tr><th>합계</th><td>44시간(44회) 이상</td><td class="num" colspan="3"><b>${foot}</b></td></tr></tfoot></table>`;
  }
  function viewReport() {
    const y = reportYear;
    return crumbs([{ label: "처음", hash: "#home" }, { label: "이수 현황표" }]) + `
      <h1>📊 ${y}년 안전교육 이수 현황표</h1>
      <p class="lead">교육 기록으로 영역별 이수 횟수와 주기를 자동으로 계산해요(${SESSION_NOTE}). 점검이나 보고 때 인쇄하거나 한글에 붙여 넣어 쓰세요.</p>
      <div class="form-actions no-print" style="margin-bottom:16px">
        <button class="big-link ghost" onclick="reportYear--;render()">◀ ${y - 1}년</button>
        ${y < new Date().getFullYear() ? `<button class="big-link ghost" onclick="reportYear++;render()">${y + 1}년 ▶</button>` : ""}
      </div>
      <div class="table-wrap">${reportTableHTML(y)}</div>
      <p class="meta">기준: ${esc(DATA.meta.basis)} · "주기 확인"은 교육 사이 간격이 주기(2·3·6개월)를 넘은 적이 있다는 뜻이에요.</p>
      <div class="form-actions no-print" style="margin-top:16px">
        <button class="play-btn" style="--c:var(--accent)" onclick="copyHtml(this, reportTableHTML(${y}, true), reportPlain(${y}))">📋 한글에 붙여 넣기용 복사</button>
        ${window.NO_FILES ? "" : `<button class="big-link ghost" onclick="window.print()">🖨️ 인쇄하기</button>`}
        <button class="big-link ghost" onclick="go('#plan')">📅 연간 계획표</button>
      </div>`;
  }
  function reportPlain(y) {
    return reportRows(y).map(x => `${x.a.name}\t${x.rs.length}/${x.a.requiredHours}회\t` + x.list.map(l => `${l.date} ${l.title}`).join(", ")).join("\n");
  }
  /* 표를 한글에 붙여 넣을 수 있게 HTML로 복사 (안 되면 글자만 복사) */
  function copyHtml(btn, html, text) {
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        const o = btn.textContent;
        navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })])
          .then(() => { btn.textContent = "✔ 복사했어요. 한글에서 Ctrl+V"; setTimeout(() => btn.textContent = o, 2200); }, () => copyText(btn, text));
        return;
      }
    } catch (e) {}
    copyText(btn, text);
  }

  /* ---------- 한글(.hwpx) 일지 만들기: 빈 양식에 내용을 채워 새 파일로 ---------- */
  function b64ToBytes(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zipStore(files) { /* 압축 없이 묶기 (mimetype이 맨 앞) */
    const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
    const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    files.forEach(f => {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/hwp+zip" });
  }
  function fillHwpxSection(xml, F) {
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const HP = "http://www.hancom.co.kr/hwpml/2011/paragraph";
    const cells = {};
    Array.from(doc.getElementsByTagNameNS(HP, "tc")).forEach(tc => {
      const ad = tc.getElementsByTagNameNS(HP, "cellAddr")[0];
      if (ad) cells[ad.getAttribute("colAddr") + "," + ad.getAttribute("rowAddr")] = tc;
    });
    const put = (key, text, top) => {
      const tc = cells[key]; if (!tc) return;
      const sub = tc.getElementsByTagNameNS(HP, "subList")[0];
      if (top) sub.setAttribute("vertAlign", "TOP");
      const p0 = sub.getElementsByTagNameNS(HP, "p")[0];
      Array.from(sub.getElementsByTagNameNS(HP, "p")).slice(1).forEach(p => p.remove());
      const lines = String(text || "").split("\n");
      lines.forEach((line, i) => {
        const p = i === 0 ? p0 : p0.cloneNode(true);
        Array.from(p.getElementsByTagNameNS(HP, "linesegarray")).forEach(n => n.remove());
        const runs = p.getElementsByTagNameNS(HP, "run");
        const run = runs[0];
        Array.from(runs).slice(1).forEach(r => r.remove());
        while (run.firstChild) run.removeChild(run.firstChild);
        if (line) { const t = doc.createElementNS(HP, "hp:t"); t.textContent = line; run.appendChild(t); }
        if (i > 0) sub.appendChild(p);
      });
    };
    put("1,2", F.program); put("1,3", F.title); put("4,3", F.manager); put("1,4", F.place); put("4,4", F.date);
    put("1,5", F.leader); put("4,5", F.materials); put("1,6", F.participants);
    put("1,7", F.content, true); put("1,8", F.opinion, true);
    return new XMLSerializer().serializeToString(doc);
  }
  function buildHwpx(r) {
    const F = recordFields(r), enc = new TextEncoder();
    const files = window.HWPX_TEMPLATE.map(f => {
      let data = b64ToBytes(f.b64);
      if (f.name === "Contents/section0.xml") {
        let xml = fillHwpxSection(new TextDecoder().decode(data), F);
        if (!xml.startsWith("<?xml")) xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + xml;
        data = enc.encode(xml);
      }
      if (f.name === "Preview/PrvText.txt") data = enc.encode(`<프로그램일지><${F.program}><${F.title}><${F.date}>`);
      return { name: f.name, data };
    });
    return zipStore(files);
  }
  function downloadHwpx(id, given) {
    const r = given || loadRecords().find(x => x.id === id); if (!r) return;
    if (!window.HWPX_TEMPLATE) { alertBox("한글 양식 파일(data/hwpx-template.js)을 찾지 못했어요."); return; }
    const { t } = findTopic(r.areaId, r.topicId);
    downloadBlob(buildHwpx(r), `프로그램일지_${r.date}_${(t ? t.title : "교육").replace(/[\\/:*?"<>|]/g, "").slice(0, 30)}.hwpx`);
  }

  /* ---------------- 그리기 ---------------- */
  function render() {
    if (!DATA) {
      $app.innerHTML = `<div class="placeholder"><strong>데이터를 불러오지 못했어요</strong>data/areas.js 파일이 있는지 확인해 주세요.</div>`;
      return;
    }
    const parts = parseHash();
    const findArea = id => DATA.areas.find(a => a.id === id);
    const okLevel = id => LEVELS.some(l => l.id === id);
    let html;
    if (parts.length === 0) html = viewHome();
    else if (parts[0] === "area" && findArea(parts[1]) && parts.length === 2) html = viewLevel(findArea(parts[1]));
    else if (parts[0] === "area" && findArea(parts[1]) && okLevel(parts[2])) html = viewTopics(findArea(parts[1]), parts[2]);
    else if (parts[0] === "topic" && findArea(parts[1]) && okLevel(parts[3])) {
      const { a, t } = findTopic(parts[1], parts[2]);
      html = t ? viewLesson(a, t, parts[3]) : notFound();
    }
    else if (parts[0] === "pick" && findArea(parts[1]) && okLevel(parts[3])) {
      const a = findArea(parts[1]);
      const t = a.topics.elementary.find(x => x.id === parts[2]);
      html = t ? viewPick(a, t, parts[3]) : notFound();
    }
    else if (parts[0] === "records") html = viewRecords();
    else if (parts[0] === "plan") html = viewPlan();
    else if (parts[0] === "report") html = viewReport();
    else if (parts[0] === "log") { const r = loadRecords().find(x => x.id === parts[1]); html = r ? viewLog(r) : notFound(); }
    else if (parts[0] === "edit") { const r = loadRecords().find(x => x.id === parts[1]); const ft = r && findTopic(r.areaId, r.topicId); html = ft && ft.t ? viewWrite(ft.a, ft.t, r.level, r) : notFound(); }
    else if (parts[0] === "write" && findArea(parts[1]) && okLevel(parts[3])) {
      const { a, t } = findTopic(parts[1], parts[2]);
      html = t ? viewWrite(a, t, parts[3]) : notFound();
    }
    else html = notFound();
    if (render._last !== location.hash) lessonTab = 'slides';
    const keepScroll = render._last === location.hash;
    render._last = location.hash;
    $app.innerHTML = html;
    fitMinis();
    if (!keepScroll) window.scrollTo(0, 0);
    const h1 = $app.querySelector("h1");
    document.title = (h1 ? h1.textContent.trim() + " – " : "") + "6대 의무교육 도우미";
  }
  render();
</script>
