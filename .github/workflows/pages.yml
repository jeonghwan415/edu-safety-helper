# main 브랜치에 올리면 GitHub Pages로 자동 배포해요 (빌드 없음, 폴더 그대로)
name: Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 올릴 파일 고르기 (개발용 파일 빼기)
        run: |
          mkdir _site
          cp -r index.html .nojekyll data img worksheets slides docs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
